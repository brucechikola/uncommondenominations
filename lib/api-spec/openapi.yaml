          type: string
        type:
          type: string
          enum: [paperback, hardcover]
        priceKwacha:
          type: number
        description:
          type: string
        features:
          type: array
          items:
            type: string
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [fullName, phone, email, deliveryAddress, city, productType, quantity]
      properties:
        fullName:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 8
        email:
          type: string
          format: email
        deliveryAddress:
          type: string
          minLength: 5
        city:
          type: string
          minLength: 2
        productType:
          type: string
          enum: [paperback, hardcover]
        quantity:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]

    Order:
      type: object
      required: [id, fullName, phone, email, deliveryAddress, city, productType, quantity, totalAmount, status, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
        deliveryAddress:
          type: string
        city:
          type: string
        productType:
          type: string
        quantity:
          type: integer
        totalAmount:
          type: number
        status:
          type: string
          enum: [pending, confirmed, awaiting_delivery, picked_up, in_transit, delivered, failed_delivery, cancelled]
        courierId:
          type: ["integer", "null"]
        trackingNotes:
          type: ["string", "null"]
        deliveryPaymentMethod:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        payment:
          $ref: "#/components/schemas/Payment"

    PaymentInput:
