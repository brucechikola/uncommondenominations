          type: integer
        method:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [pending, successful, failed]
        reference:
          type: string
        phoneNumber:
          type: ["string", "null"]
        accountName:
          type: ["string", "null"]
        gatewayTransactionId:
          type: ["string", "null"]
        gatewayStatus:
          type: ["string", "null"]
        gatewayCheckoutUrl:
          type: ["string", "null"]
        gatewayProviderReference:
          type: ["string", "null"]
        gatewayIdempotencyKey:
          type: ["string", "null"]
        gatewayLastPayload:
          type: ["object", "null"]
