openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Book sales platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Book products
  - name: orders
    description: Order management
  - name: payments
    description: Payment processing
  - name: reviews
    description: Customer reviews
  - name: visitors
    description: Visitor tracking
  - name: contact
    description: Contact form
  - name: admin
    description: Admin operations
  - name: agent
    description: Agent portal operations
  - name: courier
    description: Courier portal operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all book products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  /payments:
    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Initiate a payment for an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Validation error

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Not found

  /payments/{id}/refresh:
    post:
      operationId: refreshPayment
      tags: [payments]
      summary: Refresh payment status from the gateway
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Not found

  /payments/{id}/simulate:
    patch:
      operationId: simulatePayment
      tags: [payments]
      summary: Simulate payment outcome (success/failure)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSimulate"
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Not found

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List approved reviews
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Validation error

  /visitors/track:
    post:
      operationId: trackVisitor
      tags: [visitors]
      summary: Track a page visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorTrack"
      responses:
        "201":
          description: Visit tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorTrackResult"

  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResult"
        "400":
          description: Validation error

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid credentials

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List all orders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrdersResult"
        "401":
          description: Unauthorized

  /admin/buyers:
    get:
      operationId: listAdminBuyers
      tags: [admin]
      summary: List all buyers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Buyers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBuyersResult"
        "401":
          description: Unauthorized

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: List all payments
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: method
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Payments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentsResult"
        "401":
          description: Unauthorized

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get sales and visitor analytics
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [daily, weekly, monthly]
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "401":
          description: Unauthorized

  /admin/export/orders:
    get:
      operationId: exportOrders
      tags: [admin]
      summary: Export orders as CSV data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders CSV data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
        "401":
          description: Unauthorized

  /admin/export/buyers:
    get:
      operationId: exportBuyers
      tags: [admin]
      summary: Export buyers as CSV data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Buyers CSV data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
        "401":
          description: Unauthorized

  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [admin]
      summary: List all reviews including pending
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: approved
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false", "all"]
      responses:
        "200":
          description: Reviews list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReviewsResult"
        "401":
          description: Unauthorized

  /admin/reviews/{id}/approve:
    patch:
      operationId: approveReview
      tags: [admin]
      summary: Approve a review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Not found

  /admin/reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [admin]
      summary: Delete a review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "404":
          description: Not found

  /admin/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, awaiting_delivery, picked_up, in_transit, delivered, failed_delivery, cancelled]
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  /admin/contacts:
    get:
      operationId: listAdminContacts
      tags: [admin]
      summary: List all contact messages
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Contact messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContactsResult"
        "401":
          description: Unauthorized

  /admin/payment-settings:
    get:
      operationId: getAdminPaymentSettings
      tags: [admin]
      summary: Get all payment channel settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment channel settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentSetting"
        "401":
          description: Unauthorized

  /admin/payment-settings/{channelId}:
    patch:
      operationId: updatePaymentSetting
      tags: [admin]
      summary: Enable or disable a payment channel
      security:
        - bearerAuth: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentSetting"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSetting"
        "404":
          description: Not found

  /admin/agents:
    get:
      operationId: listAdminAgents
      tags: [admin]
      summary: List all agents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agents list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentProfile"
        "401":
          description: Unauthorized
    post:
      operationId: createAgent
      tags: [admin]
      summary: Create a new agent account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentInput"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          description: Validation error
        "409":
          description: Agent with that email or phone already exists

  /admin/agents/{id}:
    patch:
      operationId: updateAgent
      tags: [admin]
      summary: Update agent details or active status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentInput"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          description: Not found

  /admin/agents/{id}/reset-password:
    patch:
      operationId: resetAgentPassword
      tags: [admin]
      summary: Reset an agent password
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 6
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "404":
          description: Not found

  /admin/stock:
    get:
      operationId: getAdminStock
      tags: [admin]
      summary: Get stock levels for all products
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stock list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductWithStock"
        "401":
          description: Unauthorized

  /admin/stock/{type}:
    patch:
      operationId: updateStock
      tags: [admin]
      summary: Update stock quantity for a product type
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [paperback, hardcover]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stockQuantity]
              properties:
                stockQuantity:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Stock updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductWithStock"
        "404":
          description: Not found

  /agent/login:
    post:
      operationId: agentLogin
      tags: [agent]
      summary: Agent login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLoginResult"
        "401":
          description: Invalid credentials

  /agent/me:
    get:
      operationId: getAgentMe
      tags: [agent]
      summary: Get current agent profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "401":
          description: Unauthorized

  /agent/orders:
    get:
      operationId: listAgentOrders
      tags: [agent]
      summary: List orders created by this agent
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Agent orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOrdersResult"
        "401":
          description: Unauthorized
    post:
      operationId: createAgentOrder
      tags: [agent]
      summary: Create an order on behalf of a customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentOrderInput"
      responses:
        "201":
          description: Order created with payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOrderResult"
        "400":
          description: Validation error
        "409":
          description: Insufficient stock

  /agent/stats:
    get:
      operationId: getAgentStats
      tags: [agent]
      summary: Get agent sales summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStats"
        "401":
          description: Unauthorized

  /pay/{token}:
    get:
      operationId: getOrderByPaymentToken
      tags: [payments]
      summary: Get order details via payment link token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Payment link not found

  /payment-settings:
    get:
      operationId: getPaymentSettings
      tags: [payments]
      summary: Get enabled payment channels (public)
      responses:
        "200":
          description: Enabled payment channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentSetting"

  /admin/couriers:
    get:
      operationId: listAdminCouriers
      tags: [admin]
      summary: List all couriers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of couriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourierProfile"
        "401":
          description: Unauthorized
    post:
      operationId: createCourier
      tags: [admin]
      summary: Create a new courier account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourierInput"
      responses:
        "201":
          description: Courier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierProfile"
        "400":
          description: Validation error

  /admin/couriers/{id}:
    patch:
      operationId: updateCourier
      tags: [admin]
      summary: Update courier active status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Courier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierProfile"
        "404":
          description: Not found

  /admin/orders/{id}:
    get:
      operationId: getAdminOrder
      tags: [admin]
      summary: Get a single order with full details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "404":
          description: Not found

  /admin/orders/{id}/assign-courier:
    post:
      operationId: assignCourier
      tags: [admin]
      summary: Assign a courier to an order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCourierInput"
      responses:
        "200":
          description: Courier assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "404":
          description: Not found

  /admin/orders/{id}/unassign-courier:
    post:
      operationId: unassignCourier
      tags: [admin]
      summary: Unassign the courier from an order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Courier unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "404":
          description: Not found

  /courier/login:
    post:
      operationId: courierLogin
      tags: [courier]
      summary: Courier login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierLoginResult"
        "401":
          description: Invalid credentials

  /courier/me:
    get:
      operationId: getCourierMe
      tags: [courier]
      summary: Get current courier profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Courier profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierProfile"
        "401":
          description: Unauthorized

  /courier/orders:
    get:
      operationId: listCourierOrders
      tags: [courier]
      summary: List orders assigned to this courier
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Assigned orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierOrdersResult"
        "401":
          description: Unauthorized

  /courier/orders/{id}/status:
    patch:
      operationId: updateCourierOrderStatus
      tags: [courier]
      summary: Update delivery status for an assigned order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierOrderResult"
        "403":
          description: Order not assigned to this courier
        "404":
          description: Not found

  /courier/stats:
    get:
      operationId: getCourierStats
      tags: [courier]
      summary: Get courier delivery stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Courier stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierStats"
        "401":
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Product:
      type: object
      required: [id, name, type, priceKwacha, description]
      properties:
